name: build-exe

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build EXE
        run: pyinstaller --onefile --noconsole --name JinjuAirAlert jinju_air_alert.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JinjuAirAlert-exe
          path: dist/JinjuAirAlert.exe
